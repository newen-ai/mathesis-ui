name: CI

on:
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time public config only; no secrets. Vercel builds the real deploys with its own env.
      APP_ENV: test
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        # Fails if coverage drops below the thresholds in vitest.config.ts.
        run: npm run test:coverage

      - name: Build
        run: npm run build
